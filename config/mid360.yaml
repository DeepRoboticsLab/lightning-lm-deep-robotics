# Livox Mid360 — shared mapping and localization preset.
# All six pose degrees of freedom remain unconstrained.
common:
  sensor_qos: best_effort
  lidar_topic: points_raw
  livox_lidar_topic: /livox/lidar
  imu_topic: /livox/imu
fasterlio:
  lidar_type: 1
  scan_line: 32
  blind: 0.1
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 4
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  imu_filter: false
  motion_model: constant_velocity
  kf_dis_th: 1.0
  kf_angle_th: 10.0
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  # Tested mounting, not a universal Mid360 calibration: p_imu = R * p_lidar + T.
  extrinsic_T:
  - 0
  - 0
  - 0.28
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  keep_first_imu_estimation: false
g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.5
  max_th_floor: 1.0
  grid_map_resolution: 0.2
system:
  with_loop_closing: true
  with_ui: true
  with_2dui: false
  with_g2p5: false
  step_on_kf: false
  map_path: ./data/new_map/
  pub_tf: true
loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 20.0
  ndt_score_th: 1.3
  with_height: false
  optimize_on_every_keyframe: false
lidar_loc:
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  max_frequency: 5.0
  loc_on_kf: false
  try_self_extrap: true
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: false
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: false
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
